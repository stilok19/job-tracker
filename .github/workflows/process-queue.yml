name: Process Job Queue

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run processor
        run: node process.js

      - name: Commit cleared queue
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add pending.json
          git diff --staged --quiet || git commit -m "Clear processed queue"
          git push
